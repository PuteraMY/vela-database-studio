name: VELA quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: vela-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - run: npm run curated
      - run: npm run fuzz
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vela-verification
          path: artifacts/
          retention-days: 14
